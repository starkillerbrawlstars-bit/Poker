</style></head><body><div class="w" id="app">Lade …</div><div id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const A=document.getElementById('app'),SU='♠♥♦♣',HN=['Hohe Karte','Paar','Zwei Paare','Drilling','Straße','Flush','Full House','Vierling','Straight Flush'];
let db,uid,P,T=[],PL=[],cur=null,raise=0,err='',rs=false,TL=false,busy=false,HI=[];
const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RK=r=>({11:'B',12:'D',13:'K',14:'A'}[r]||r),fm=n=>(n>0?'+':'')+n,cl=o=>JSON.parse(JSON.stringify(o));
let OFF=0,SY=false;const now=()=>Date.now()+OFF;
async function sync(){try{const r=db.doc('clock/'+uid),a=Date.now();await r.set({t:firebase.firestore.FieldValue.serverTimestamp()});const d=await r.get({source:'server'}),b=Date.now();OFF=d.data().t.toMillis()-(a+b)/2;SY=true;chkWeek();draw()}catch(e){}}
const SH={},PV={};let LV='';
const TS={};
function remain(t){const k=t.id+'|'+(t.hn||0)+'|'+t.ph+'|'+t.turn+'|'+t.dl;if(!(k in TS))TS[k]=Date.now();return 30-(Date.now()-TS[k])/1e3}
function myAlert(){toast('🃏 Du bist dran!',4e3);
 try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=660;o.start();o.stop(c.currentTime+.15)}catch(e){}}
const el=k=>{const n=Date.now();if(!(k in SH))SH[k]=n;return n-SH[k]};
function an(k,d,f){const n=Date.now();if(!(k in SH))SH[k]=n+(d||0);const e=n-SH[k];return e<900?` n${f?' fl':''}" style="animation-delay:${-e}ms`:''}
const cd=(c,k,d,f)=>{const a=k?an(k,d,f):'';return c==null?`<i class="c bk${a}"></i>`:`<i class="c${[1,2].includes(c/13|0)?' r':''}${a}">${RK(c%13+2)}<b>${SU[c/13|0]}</b></i>`};
function anim(){document.querySelectorAll('.num').forEach(e=>{const k=e.dataset.k,v=+e.dataset.v,f=PV[k]??v;PV[k]=v;if(f==v)return;const t0=performance.now();(function st(t){const p=Math.min(1,(t-t0)/600);e.textContent=Math.round(f+(v-f)*p);if(p<1)requestAnimationFrame(st)})(t0)})}
function wk(){const[y,m,d]=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Berlin',year:'numeric',month:'2-digit',day:'2-digit'}).format(now()).split('-').map(Number);
 const t=new Date(Date.UTC(y,m-1,d));t.setUTCDate(t.getUTCDate()-(t.getUTCDay()+6)%7+3);
 const y1=t.getUTCFullYear(),j=new Date(Date.UTC(y1,0,4));return y1+'-KW'+String(1+Math.round(((t-j)/864e5-3+(j.getUTCDay()+6)%7)/7)).padStart(2,'0')}
/* ---------- Hand-Auswertung ---------- */
function ev(c){const r=c.map(x=>x%13+2).sort((a,b)=>b-a),fl=c.every(x=>(x/13|0)==(c[0]/13|0)),u=[...new Set(r)];let st=0;
 if(u.length==5){if(u[0]-u[4]==4)st=u[0];else if(u[0]==14&&u[1]==5)st=5}
 const n={};r.forEach(x=>n[x]=(n[x]||0)+1);const g=Object.keys(n).map(Number).sort((a,b)=>n[b]-n[a]||b-a),sh=g.map(x=>n[x]).join('');
 const cat=st&&fl?8:sh=='41'?7:sh=='32'?6:fl?5:st?4:sh=='311'?3:sh=='221'?2:sh=='2111'?1:0,a=[cat,...(st?[st]:g)];
 while(a.length<6)a.push(0);return a.reduce((x,y)=>x*15+y,0)}
const hs=c=>c.length==5?ev(c):c.length==6?Math.max(...c.map((_,i)=>ev(c.filter((_,k)=>k!=i)))):best(c);
function best(c){let m=0;for(let i=0;i<7;i++)for(let j=i+1;j<7;j++){const v=ev(c.filter((_,k)=>k!=i&&k!=j));if(v>m)m=v}return m}
/* ---------- Spiellogik (läuft im Browser des Spielers, der am Zug ist) ---------- */
const live=s=>s.seats.filter(x=>!x.f);
function post(s,i,a){const x=s.seats[i];a=Math.min(a,x.stack);x.stack-=a;x.bet+=a;x.tot+=a;if(!x.stack)x.ai=true}
function nextActor(s,from){const n=s.seats.length;for(let k=1;k<=n;k++){const i=(from+k)%n,x=s.seats[i];if(!x.f&&!x.ai)return i}return -1}
function startHand(s){
 s.seats=s.seats.filter(x=>!x.left&&x.stack>0);
 if(s.seats.length<2){s.ph='wait';s.msg='Warte auf Mitspieler …';return}
 const d=[...Array(52).keys()];for(let i=51;i>0;i--){const j=Math.random()*(i+1)|0;[d[i],d[j]]=[d[j],d[i]]}
 s.deck=d;s.board=[];s.ro=[];s.hn=(s.hn||0)+1;s.ph='pre';s.rv=false;s.msg='';s.log=['Neue Runde'];s.dealer=(s.dealer+1)%s.seats.length;
 s.seats.forEach(x=>Object.assign(x,{bet:0,tot:0,f:false,ai:false,a:false,w:0,sc:0,h:[d.pop(),d.pop()]}));
 const n=s.seats.length,sb=n==2?s.dealer:(s.dealer+1)%n,bb=(sb+1)%n;
 post(s,sb,10);post(s,bb,20);s.cb=20;s.mr=20;
 const t=nextActor(s,bb);if(t<0){s.turn=0;advance(s)}else{s.turn=t;s.dl=now()+3e4;if(live(s).filter(x=>!x.ai).length<2&&s.seats[t].bet>=s.cb)advance(s)}
}
function act(s,t,amt){
 const i=s.turn,x=s.seats[i];
 if(t=='f'){x.f=true;s.log.push(x.name+' foldet')}
 else if(t=='c'){const a=Math.min(s.cb-x.bet,x.stack);post(s,i,a);s.log.push(x.name+(a?' callt '+a:' checkt'))}
 else{const to=Math.min(amt,x.bet+x.stack),inc=to-s.cb;
  if(inc>0){if(inc>=s.mr)s.mr=inc;s.seats.forEach(y=>{if(y!=x)y.a=false});s.cb=to}
  post(s,i,to-x.bet);s.log.push(x.name+(x.ai?' geht All-in ('+to+')':' erhöht auf '+to))}
 x.a=true;s.log=s.log.slice(-6);advance(s)}
function advance(s){
 const L=live(s);if(L.length<2)return award(s);
 const can=L.filter(x=>!x.ai),done=can.every(x=>x.bet>=s.cb&&(x.a||can.length<2));
 if(!done){s.turn=nextActor(s,s.turn);s.dl=now()+3e4;return}
 if(s.ph=='river')return showdown(s);
 s.seats.forEach(x=>{x.bet=0;x.a=false});s.cb=0;s.mr=20;
 s.ph={pre:'flop',flop:'turn',turn:'river'}[s.ph];
 for(let k=s.ph=='flop'?3:1;k>0;k--)s.board.push(s.deck.pop());
 if(can.length<2)return advance(s);
 s.turn=nextActor(s,s.dealer);s.dl=now()+3e4}
function award(s){const w=live(s)[0],p=s.seats.reduce((a,x)=>a+x.tot,0);w.stack+=p;w.w=p;s.ph='show';s.rv=false;s.msg=w.name+' gewinnt '+p+' Chips';
 s.ro=[...Array(5-s.board.length)].map((_,i)=>s.deck[s.deck.length-1-i]);if(s.ro.length)s.msg+=' · gestrichelt: Karten, die noch gekommen wären'}
function showdown(s){
 const L=live(s);L.forEach(x=>x.sc=best(x.h.concat(s.board)));
 const lv=[...new Set(L.map(x=>x.tot))].sort((a,b)=>a-b);let pv=0;
 lv.forEach(l=>{const pot=s.seats.reduce((a,x)=>a+Math.max(0,Math.min(x.tot,l)-pv),0),el=L.filter(x=>x.tot>=l),m=Math.max(...el.map(x=>x.sc)),ws=el.filter(x=>x.sc==m);
  ws.forEach((x,k)=>{const g=Math.floor(pot/ws.length)+(k?0:pot%ws.length);x.stack+=g;x.w+=g});pv=l});
 s.ph='show';s.rv=true;s.msg=s.seats.filter(x=>x.w>0).map(x=>x.name+' +'+x.w+' ('+HN[x.sc/15**5|0]+')').join(' · ')}
/* ---------- Datenbank ---------- */
const save=s=>{const{id,...r}=s;return db.doc('tables/'+(s.id||cur)).set(r).catch(e=>{err=e.message;draw()})};
const upd=d=>db.doc('players/'+uid).update(d).catch(e=>{err=e.message;draw()});
const myT=()=>T.find(t=>t.id==cur);
const mySeat=(t)=>t&&t.seats.findIndex(x=>x.id==uid&&!x.left);
const TXL=[];
const TX=fn=>{const n=Date.now();while(TXL.length&&n-TXL[0]>6e4)TXL.shift();
 if(TXL.length>=40){err='Schutzbremse: zu viele Aktionen in kurzer Zeit. Bitte Seite neu laden.';draw();return Promise.resolve(null)}
 TXL.push(n);return db.runTransaction(fn).catch(e=>{err=e.message;draw();return null})};
const lg=(tx,k,u,d,i)=>tx.set(db.collection('ledger').doc(),{k,u,d,i:String(i||''),ts:now()});
const tref=id=>db.doc('tables/'+id),pref=id=>db.doc('players/'+id),ACT=['pre','flop','turn','river'];
function pb(p){const t=myT(),i=mySeat(t);if(!(i>=0))return;const x=t.seats[i],pot=t.seats.reduce((a,y)=>a+y.tot,0),need=Math.max(0,t.cb-x.bet),mx=x.bet+x.stack,mn=Math.min(t.cb+t.mr,mx);
 raise=Math.max(mn,Math.min(mx,Math.round((t.cb+p/100*(pot+need))/5)*5));
 const sl=document.getElementById('rs'),l=document.getElementById('rl');if(sl)sl.value=raise;if(l)l.textContent=raise}
function go(t,a){err='';const id=cur;TX(async tx=>{const d=await tx.get(tref(id));if(!d.exists)return;const s=d.data();
 if(!ACT.includes(s.ph)||!s.seats[s.turn]||s.seats[s.turn].id!=uid)return;
 act(s,t,a);tx.set(tref(id),s)})}
function setRaise(a){raise=a;const r=document.getElementById('rs'),l=document.getElementById('rl');if(r)r.value=a;if(l)l.textContent=a}
function nextHand(){err='';const id=cur;TX(async tx=>{const d=await tx.get(tref(id));if(!d.exists)return;const s=d.data();
 if(s.ph!='show'&&s.ph!='wait')return;startHand(s);tx.set(tref(id),s)})}
async function setName(){const n=document.getElementById('nm').value.trim().slice(0,16);if(!n)return;
 await db.doc('players/'+uid).set({name:n,chips:1000,rebuys:0,week:wk(),table:null})}
async function mk(){const n=document.getElementById('tn').value.trim().slice(0,20);if(!n)return;
 const id='T'+Date.now().toString(36);await db.doc('tables/'+id).set({name:n,seats:[],ph:'wait',dealer:-1,turn:0,cb:0,mr:20,deck:[],board:[],log:[],msg:'Warte auf Mitspieler …',rv:false});join(id)}
function join(id){err='';TX(async tx=>{
 const td=await tx.get(tref(id)),pd=await tx.get(pref(uid));if(!td.exists||!pd.exists)return 0;
 const s=td.data(),p=pd.data(),x=s.seats.find(y=>y.id==uid&&!y.left);
 if(x&&p.table==id)return 1;
 if(p.table&&p.table!=id){const od=await tx.get(tref(p.table));if(od.exists&&od.data().seats.some(y=>y.id==uid&&!y.left))throw new Error('Du sitzt noch an einem anderen Tisch – geh erst dorthin zurück und verlasse ihn.')}
 if((p.chips||0)<=0)throw new Error('Keine Chips mehr – hol dir einen Rebuy.');
 s.seats=s.seats.filter(y=>y.id!=uid);
 s.seats.push({id:uid,name:p.name,stack:p.chips,bet:0,tot:0,f:true,ai:false,a:true,h:[],w:0,sc:0});
 tx.set(tref(id),s);tx.update(pref(uid),{chips:0,table:id});lg(tx,'join',uid,p.chips,id);return 1}).then(r=>{if(r){cur=id;draw()}})}
function leave(){err='';const id=cur;if(!id)return;
 TX(async tx=>{const d=await tx.get(tref(id)),pd=await tx.get(pref(uid));if(!pd.exists)return 1;const p=pd.data();
  const s=d.exists?d.data():null,i=s?s.seats.findIndex(x=>x.id==uid&&!x.left):-1;
  if(i<0){tx.update(pref(uid),{table:null});return 1}
  const x=s.seats[i],back=x.stack;x.stack=0;x.left=true;
  if(ACT.includes(s.ph)&&!x.f){x.f=true;if(s.turn==i||live(s).length<2)advance(s)}
  if(s.seats.some(y=>!y.left))tx.set(tref(id),s);else tx.delete(tref(id));
  tx.update(pref(uid),{chips:(p.chips||0)+back,table:null});lg(tx,'leave',uid,back,id);return 1}).then(()=>{cur=null;draw()})}
function rebuy(){err='';const id=cur;
 TX(async tx=>{const pd=await tx.get(pref(uid));if(!pd.exists)return;const p=pd.data(),rb=(p.rebuys||0)+1;
  const d=id?await tx.get(tref(id)):null;
  if(d&&d.exists){const s=d.data(),i=s.seats.findIndex(x=>x.id==uid&&!x.left);
   if(i>=0){const x=s.seats[i];if(ACT.includes(s.ph)&&!x.f)throw new Error('Rebuy geht erst nach deiner Runde.');x.stack+=1000;tx.set(tref(id),s);tx.update(pref(uid),{rebuys:rb});lg(tx,'rebuy',uid,1000,id);return}}
  tx.update(pref(uid),{chips:(p.chips||0)+1000,rebuys:rb});lg(tx,'rebuy',uid,1000,'lobby')})}
/* ---------- 30-Sekunden-Timer ---------- */
let fired=0;
function kick(t){const id=t.id,dl=t.dl,turn=t.turn;
 TX(async tx=>{const d=await tx.get(tref(id));if(!d.exists)return;const s=d.data();
  if(s.dl!==dl||s.turn!==turn||!ACT.includes(s.ph))return;
  const x=s.seats[s.turn],pd=await tx.get(pref(x.id));
  act(s,s.cb>x.bet?'f':'c');const back=x.stack;x.stack=0;x.left=true;x.f=true;
  s.log.push(x.name+' wurde wegen Inaktivität entfernt');s.log=s.log.slice(-6);
  if(s.ph!='show'){if(live(s).length<2)award(s);else if(s.seats[s.turn].f){const nx=nextActor(s,s.turn);if(nx>=0){s.turn=nx;s.dl=now()+3e4}else advance(s)}}
  if(s.seats.some(y=>!y.left))tx.set(tref(id),s);else tx.delete(tref(id));
  if(pd.exists){tx.update(pref(x.id),{chips:(pd.data().chips||0)+back,table:null,kicked:true});lg(tx,'kick',x.id,back,id)}})}
